<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
ShittimEcho 项目支持中心
</title>


<style>


*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    font-family:
    "Microsoft YaHei",
    sans-serif;

    background:

    linear-gradient(
    135deg,
    #dff4ff,
    #ffffff,
    #c9ecff
    );

    overflow-x:hidden;

}


/* 背景粒子 */

body::before{

content:"";

position:fixed;

width:100%;

height:100%;

background:

radial-gradient(
circle,
rgba(0,160,255,.18)
2px,
transparent 3px
);

background-size:40px 40px;

animation:
move 20s linear infinite;

}


@keyframes move{

from{

transform:
translateY(0);

}

to{

transform:
translateY(40px);

}

}



.container{


position:relative;

width:90%;

max-width:650px;

margin:50px auto;


background:

rgba(255,255,255,.65);


backdrop-filter:

blur(15px);


border-radius:30px;


padding:40px;


box-shadow:

0 15px 40px
rgba(0,120,255,.2);


}



.logo{


font-size:42px;

font-weight:bold;

color:#008cff;

letter-spacing:3px;


}



.subtitle{

color:#666;

font-size:18px;

margin-bottom:30px;

}



.card{


background:

rgba(255,255,255,.75);


border-radius:20px;


padding:25px;


margin:20px 0;


border:

1px solid rgba(0,150,255,.2);


transition:.3s;


}



.card:hover{


transform:

translateY(-5px);


box-shadow:

0 10px 25px
rgba(0,140,255,.25);


}



.button{


display:block;


padding:15px;


margin-top:15px;


border-radius:15px;


background:

linear-gradient(
90deg,
#4fc3ff,
#008cff
);


color:white;


text-decoration:none;


font-weight:bold;


}



img{


width:260px;

border-radius:20px;


}



h2{

color:#008cff;

}



.footer{


margin-top:40px;

color:#777;

font-size:14px;


}


</style>


</head>



<body>


<div class="container">


<div class="logo">

ShittimEcho

<br>

什亭之匣风格 Windows Terminal

开发的 Windows 终端系统。

</p>


<p>

灵感来源于《蔚蓝档案》中的什亭之匣。

</p>


</div>




<div class="card">


<h2>

<p>

<p>

href="https://ifdian.net/a/soymilk520">

🔥 爱发电支持

</div>





<div class="card">


<h2>

<p>

✔ 高度自定义化

<br><br>

感谢每一位支持 ShittimEcho 的用户 ❤️

</div>


</body>


</html>
